services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ys
      POSTGRES_PASSWORD: ys
      POSTGRES_DB: youtube_studio
    ports: ["127.0.0.1:5433:5432"]
    # Postgres 18+ imajı veriyi /var/lib/postgresql/<sürüm>/docker altında tutar.
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ys -d youtube_studio"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8.10.3-alpine
    ports: ["127.0.0.1:6380:6379"]

  # MinIO topluluk sürümü Ekim 2025'te imaj yayınlamayı bıraktı; S3 uyumlu RustFS kullanılıyor.
  rustfs:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ysrustfs
      RUSTFS_SECRET_KEY: ysrustfs-secret
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [s3data:/data]

volumes:
  pgdata:
  s3data:
